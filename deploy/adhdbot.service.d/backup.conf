# Drop-in override for adhdbot.service.
#
# Snapshots the Postgres DB on every `systemctl stop`/`restart` BEFORE the
# stack is torn down. The empty `ExecStop=` clears the unit's inherited
# ExecStop list so we can re-order it: back up first (db still up), then
# `docker compose down`. The leading `-` makes the backup best-effort so a
# failure never blocks shutdown.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/adhdbot.service.d
#   sudo cp deploy/adhdbot.service.d/backup.conf /etc/systemd/system/adhdbot.service.d/
#   sudo systemctl daemon-reload
#
# After this, `sudo systemctl restart adhdbot` writes a dump to ./backups/.

[Service]
ExecStop=
ExecStop=-/home/iray/automatic/scripts/backup_db.sh
ExecStop=/snap/bin/docker compose down
